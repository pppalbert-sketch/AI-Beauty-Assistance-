<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fdf2f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a14" media="(prefers-color-scheme: dark)" />

    <!-- Primary Meta Tags -->
    <title>BeautyAI — Your Personal AI Beauty Assistant</title>
    <meta name="title" content="BeautyAI — Your Personal AI Beauty Assistant" />
    <meta
      name="description"
      content="Analyze your skin, build personalized routines, organize your beauty products, and achieve healthier skin with AI guidance every day. Get started free."
    />
    <meta name="keywords" content="AI beauty, skincare app, skin analysis, beauty assistant, skincare routine, AI beauty coach, ingredient checker, beauty tracker" />
    <meta name="author" content="BeautyAI" />
    <link rel="canonical" href="https://beautyai.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://beautyai.app/" />
    <meta property="og:title" content="BeautyAI — Your Personal AI Beauty Assistant" />
    <meta
      property="og:description"
      content="Analyze your skin, build personalized routines, and achieve healthier skin with AI guidance every day."
    />
    <meta property="og:image" content="https://beautyai.app/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeautyAI — Your Personal AI Beauty Assistant" />
    <meta
      name="twitter:description"
      content="Analyze your skin, build personalized routines, and achieve healthier skin with AI guidance every day."
    />
    <meta name="twitter:image" content="https://beautyai.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent dark-mode flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('beautyai-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Structured data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BeautyAI",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "iOS, Android",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "ratingCount": "12480"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
